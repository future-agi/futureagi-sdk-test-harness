          timeout: 10
      - id: model_log
        method: POST
        endpoint: /model/log
        body:
          model_id: model-e2e
          model_type: GENERATIVE_LLM
          environment: PRODUCTION
          model_version: v1
          prediction_timestamp: 1767225600
          conversation:
            chat_history:
              - role: user
                content: hello
