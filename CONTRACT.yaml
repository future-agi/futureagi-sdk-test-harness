        method: POST
        path: /model-hub/develops/create-empty-dataset/
        status: 200
        response:
          status: true
          result:
            dataset_id: 00000000-0000-0000-0000-000000000123
            dataset_name: SDK e2e dataset
            dataset_model_type: GenerativeLLM
      - id: dataset_add_columns
        method: POST
        path: /model-hub/develops/00000000-0000-0000-0000-000000000123/add_columns/
        status: 200
        response:
          status: true
          result:
            columns_created: 2
      - id: dataset_add_rows
        method: POST
        path: /model-hub/develops/00000000-0000-0000-0000-000000000123/add_rows/
        status: 200
        response:
          status: true
          result:
            rows_created: 1
    actions:
      - id: reset
        method: POST
        endpoint: /reset
        body: {}
      - id: init
        method: POST
        endpoint: /init
        body:
          api_key: test-api-key
          secret_key: test-secret-key
          timeout: 10
      - id: dataset_lifecycle
        method: POST
        endpoint: /dataset/lifecycle
        body:
          name: SDK e2e dataset
          model_type: GENERATIVE_LLM
          columns:
            - name: input
              data_type: TEXT
            - name: score
              data_type: FLOAT
          rows:
            - cells:
                - column_name: input
                  value: hello
                - column_name: score
                  value: 0.98
    assertions:
      - type: mock_request
        request_id: dataset_create
        count: 1
        headers:
          X-Api-Key: test-api-key
          X-Secret-Key: test-secret-key
        json_contains:
          new_dataset_name: SDK e2e dataset
          model_type: GenerativeLLM
      - type: mock_request
        request_id: dataset_add_columns
        count: 1
        json_contains:
          new_columns_data:
            - name: input
              data_type: text
            - name: score
              data_type: float
      - type: mock_request
        request_id: dataset_add_rows
        count: 1
        json_contains:
          rows:
            - cells:
                - column_name: input
                  value: hello
                - column_name: score
                  value: 0.98
      - type: action_result
        action_id: dataset_lifecycle
        path: result.dataset.id
        expected: 00000000-0000-0000-0000-000000000123
      - type: action_result
        action_id: dataset_lifecycle
        path: result.columns_added
        expected: 2
      - type: action_result
        action_id: dataset_lifecycle
        path: result.rows_added
        expected: 1

  - id: annotation_score_lifecycle_e2e
