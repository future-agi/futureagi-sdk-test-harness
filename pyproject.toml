[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futureagi-sdk-test-harness"
version = "0.1.0"
description = "Future AGI SDK compliance test harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
futureagi-sdk-test-harness = "futureagi_sdk_test_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/futureagi_sdk_test_harness"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
